<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack AI - Auto Scan Engine</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-950 font-sans min-h-screen text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">

    <div class="max-w-md mx-auto min-h-screen flex flex-col justify-between p-4 pb-24">
        <!-- Header Section -->
        <header class="pt-4 pb-2 flex items-center justify-between border-b border-slate-800">
            <div>
                <h1 class="text-2xl font-black tracking-tight text-white flex items-center gap-1.5">
                    FinTrack <span class="bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent font-black text-xl">AI Pro</span>
                </h1>
                <p class="text-xs text-slate-400">Automatic Text Scanner & AI Ledger.</p>
            </div>
            <button onclick="resetData()" class="text-[10px] bg-slate-900 hover:bg-rose-950/40 hover:text-rose-400 px-2.5 py-1.5 rounded-xl border border-slate-800 transition font-semibold cursor-pointer">Reset 🔄</button>
        </header>

        <!-- Balance Layout Widget -->
        <div class="grid grid-cols-2 gap-3 my-4">
            <div class="bg-gradient-to-br from-slate-900 to-slate-950 p-4 rounded-2xl border border-slate-800 shadow-sm">
                <p class="text-[10px] font-bold text-indigo-400 uppercase tracking-wider">🏦 Bank Balance</p>
                <h3 id="bank-display" class="text-xl font-black mt-1 text-white tracking-tight">₹0.00</h3>
            </div>
            <div class="bg-gradient-to-br from-slate-900 to-slate-950 p-4 rounded-2xl border border-slate-800 shadow-sm">
                <p class="text-[10px] font-bold text-cyan-400 uppercase tracking-wider">⚡ UPI Lite Wallet</p>
                <h3 id="lite-display" class="text-xl font-black mt-1 text-white tracking-tight">₹0.00</h3>
            </div>
        </div>

        <!-- =================🤖 FINTRACK AI ADVISOR BLOCK ================= -->
        <div class="bg-gradient-to-r from-indigo-950/40 via-slate-900 to-cyan-950/40 border border-indigo-500/20 rounded-2xl p-4 mb-4 relative overflow-hidden">
            <div class="absolute -right-6 -top-6 w-20 h-20 bg-indigo-500/10 rounded-full blur-xl"></div>
            <div class="flex items-center gap-2 mb-2">
                <span class="text-lg">🤖</span>
                <p class="text-xs font-black tracking-wider uppercase text-indigo-300">FinTrack AI Insights</p>
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse ml-auto"></span>
            </div>
            <div id="ai-insight-text" class="text-xs text-slate-300 leading-relaxed font-medium">
                Koi transaction SMS paste karo ya add karo, AI advice active ho jayegi! 🧠🚀
            </div>
        </div>

        <!-- =================⚡ AUTOMATIC SMART PASTE INTERFACE ================= -->
        <div class="bg-slate-900/90 border border-slate-800 p-4 rounded-2xl mb-4">
            <div class="flex items-center justify-between mb-2">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-wide">🤖 Auto AI Text Scanner</p>
                <span class="text-[9px] bg-indigo-950 text-indigo-400 px-2 py-0.5 rounded-md font-semibold border border-indigo-900/50">NEW</span>
            </div>
            <textarea id="auto-sms-input" rows="2" placeholder="Bank SMS ya transaction details yahan paste karo... (e.g. Sent Rs 150 for Movie)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 custom-scrollbar resize-none mb-2"></textarea>
            <button onclick="processAutoSms()" class="w-full bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 text-white font-bold text-xs py-2 px-4 rounded-xl transition shadow-md cursor-pointer text-center">⚡ Auto Scan & Add Entry</button>
        </div>

        <!-- Rapid Manual Action Triggers -->
        <div class="grid grid-cols-2 gap-2 mb-4">
            <button onclick="openModal('income')" class="bg-slate-900 hover:bg-slate-850 text-slate-300 border border-slate-800 font-bold text-xs py-2 px-4 rounded-xl transition cursor-pointer text-center">💰 Manual In</button>
            <button onclick="openModal('expense')" class="bg-slate-900 hover:bg-slate-850 text-slate-300 border border-slate-800 font-bold text-xs py-2 px-4 rounded-xl transition cursor-pointer text-center">💸 Manual Out</button>
        </div>

        <!-- Live Passbook Console -->
        <div class="bg-slate-900/40 rounded-2xl p-4 border border-slate-800 flex-1 flex flex-col">
            <h3 class="text-xs font-bold text-slate-400 mb-3 uppercase tracking-wide flex items-center justify-between">
                <span>📋 Passbook Logs</span>
                <span id="log-count" class="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full font-mono">0 entries</span>
            </h3>
            
            <div id="logs-container" class="space-y-2 max-h-[160px] overflow-y-auto custom-scrollbar pr-1 flex-1"></div>
        </div>
    </div>

    <!-- Dynamic Transaction Modal (Manual) -->
    <div id="tx-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-xs flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 max-w-sm w-full rounded-2xl p-5 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute right-4 top-4 w-7 h-7 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-400 transition text-xs cursor-pointer">✕</button>
            <h3 id="modal-title" class="text-base font-black text-white mb-4">Add Entry</h3>
            
            <form id="modal-form" onsubmit="saveEntry(event)" class="space-y-3">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Amount (₹)</label>
                    <input type="number" id="form-amount" required min="1" class="w-full bg-slate-850 border border-slate-700 rounded-xl px-3 py-2 text-white font-semibold text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Select Account</label>
                    <select id="form-source" class="w-full bg-slate-850 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none">
                        <option value="lite">⚡ UPI Lite Wallet</option>
                        <option value="bank">🏦 Bank Account</option>
                    </select>
                </div>
                <div id="cat-block">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Category</label>
                    <select id="form-category" class="w-full bg-slate-850 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none">
                        <option value="Movie">🎬 Movie & Entertainment</option>
                        <option value="Food">🍔 Food & Drinks</option>
                        <option value="Travel">🚗 Fuel & Commute</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Bills">📱 Recharge & Bills</option>
                        <option value="Others">🧩 Others</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Description</label>
                    <input type="text" id="form-desc" placeholder="Details (e.g., Chai, Popcorn)" class="w-full bg-slate-850 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2 px-4 rounded-xl text-xs transition mt-2 cursor-pointer shadow-md">Add to Ledger</button>
            </form>
        </div>
    </div>

    <!-- Core Engine Scripts -->
    <script>
        let state = { bank: 8000, lite: 1500, logs: [] };
        let activeMode = 'expense';

        function initApp() {
            const data = localStorage.getItem('fintrack_auto_ai_core');
            if (data) state = JSON.parse(data);
            renderUI();
        }

        // =================🤖 AUTOMATIC SMS/TEXT NLP PARSING ENGINE =================
        function processAutoSms() {
            const inputField = document.getElementById('auto-sms-input');
            const text = inputField.value.trim();
            
            if (!text) return alert("Pehle koi text/SMS paste karo bhai!");

            // Regex Extraction Patterns (NLP Mock Core)
            const amountMatch = text.match(/(?:rs\.?|inr|₹|debited|sent)\s*([0-0-9,.]+)/i) || text.match(/([0-0-9,.]+)\s*(?:rs|inr|₹)/i);
            let amount = amountMatch ? parseFloat(amountMatch[1].replace(/,/g, '')) : null;
            
            if (!amount || isNaN(amount)) {
                // Fallback: search for any standalone number if keywords aren't found
                const generalNumber = text.match(/\d+/);
                if (generalNumber) amount = parseFloat(generalNumber[0]);
            }

            if (!amount) return alert("AI text mein se Amount detect nahi kar paya! Ek baar dhyan se check karo.");

            // Smart Category & Source Mapping Engine
            let category = "Others";
            let desc = "Auto Tracked Expense";
            let source = "lite"; // Default lightweight wallet allocation
            let type = "expense";

            const lowerText = text.toLowerCase();

            // Source Allocation Logic
            if (lowerText.includes("bank") || lowerText.includes("a/c") || amount > 500) {
                source = "bank";
            }

            // Type Detection
            if (lowerText.includes("credited") || lowerText.includes("received") || lowerText.includes("added")) {
                type = "income";
                category = "Deposit";
                desc = "Auto Tracked Income";
            }

            // Category Matching Matrices
            if (type === "expense") {
                if (lowerText.includes("movie") || lowerText.includes("cinema") || lowerText.includes("pvr") || lowerText.includes("popcorn") || lowerText.includes("show")) {
                    category = "Movie";
                    desc = "Cinema / Entertainment";
                } else if (lowerText.includes("food") || lowerText.includes("zomato") || lowerText.includes("swiggy") || lowerText.includes("restaurant") || lowerText.includes("chai") || lowerText.includes("hotel")) {
                    category = "Food";
                    desc = "Food & Refreshments";
                } else if (lowerText.includes("uber") || lowerText.includes("ola") || lowerText.includes("auto") || lowerText.includes("fuel") || lowerText.includes("petrol") || lowerText.includes("travel")) {
                    category = "Travel";
                    desc = "Travel / Commute";
                } else if (lowerText.includes("amazon") || lowerText.includes("flipkart") || lowerText.includes("shopping") || lowerText.includes("myntra")) {
                    category = "Shopping";
                    desc = "Shopping Item";
                } else if (lowerText.includes("recharge") || lowerText.includes("jio") || lowerText.includes("airtel") || lowerText.includes("bill")) {
                    category = "Bills";
                    desc = "Utility Bill Paid";
                }
            }

            // Capital Integrity Adjustments
            if (type === 'expense') {
                if (state[source] < amount) return alert("Auto-Scan canceled: " + (source === 'bank' ? '🏦 Bank' : '⚡ Lite') + " account parameters standard cap overflows!");
                state[source] -= amount;
            } else {
                state[source] += amount;
            }

            // Push Live Entry to Core System
            state.logs.unshift({ type, amount, source, desc, category });
            
            // Clean interface
            inputField.value = "";
            alert(`🤖 AI Success: ₹${amount} automatically detected under "${category}" using ${source === 'bank' ? '🏦 Bank' : '⚡ UPI Lite'}!`);
            
            renderUI();
        }

        // =================🤖 COGNITIVE AI INSIGHTS ENGINE =================
        function runAIEngine(totals, totalExpense) {
            const aiBox = document.getElementById('ai-insight-text');
            
            if (state.logs.length === 0) {
                aiBox.innerHTML = "Koi transaction SMS paste karo ya add karo, AI advice active ho jayegi! 🧠🚀";
                return;
            }

            let advice = "📊 **AI Status:** Budget ekdum safe zone mein hai. Auto-scan feature dabake mast entries karte raho! 😎";

            if (totalExpense > 4000) {
                advice = "⚠️ **🚨 ALERT:** Bhai, automatic tracking ke hisab se tu ₹" + totalExpense + " udaya chuka hai! AI bol raha hai ab bas kar de! 🥶";
            } else if (totals["Movie"] > 0 && totals["Movie"] >= totalExpense * 0.4) {
                advice = "🎬 **AI Roasting:** Abe deewane! Tera poora wallet toh sirf Movies aur popcorn khane mein hi khatam ho raha hai. Thoda bachat karo! 🍿";
            } else if (totals["Food"] > 1000) {
                advice = "🍔 **AI Health Check:** Food entries badh rahi hain! Zomato/Swiggy ka bhoot utaro, varna wallet par bhaari padega! 🍕";
            } else if (state.lite < 300 && state.lite > 0) {
                advice = "⚡ **Lite Alert:** Tere UPI Lite ka top-up karne ka time aa gaya hai (₹" + state.lite.toFixed(2) + " left). Agli chai peene se pehle load kar lena! ☕";
            }

            aiBox.innerHTML = advice;
        }

        function renderUI() {
            document.getElementById('bank-display').innerText = `₹${state.bank.toFixed(2)}`;
            document.getElementById('lite-display').innerText = `₹${state.lite.toFixed(2)}`;
            document.getElementById('log-count').innerText = `${state.logs.length} entries`;

            const container = document.getElementById('logs-container');
            container.innerHTML = state.logs.length === 0 ? `<div class="text-center py-8 text-slate-600 text-xs font-medium">No logs recorded yet.</div>` : '';

            const totals = { "Movie": 0, "Food": 0, "Travel": 0, "Shopping": 0, "Bills": 0, "Others": 0 };
            let totalExpense = 0;

            state.logs.forEach(item => {
                const isExp = item.type === 'expense';
                const el = document.createElement('div');
                el.className = `flex items-center justify-between p-3 rounded-xl bg-slate-900/50 border ${isExp ? 'border-rose-950/40 bg-rose-950/5' : 'border-emerald-950/40 bg-emerald-950/5'}`;
                el.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center text-sm ${isExp ? 'bg-rose-950/40 text-rose-400' : 'bg-emerald-950/40 text-emerald-400'}">${isExp ? '📉' : '📈'}</div>
                        <div>
                            <p class="text-xs font-bold text-white">${item.desc} <span class="text-[9px] font-normal text-slate-500">(${item.source === 'bank' ? '🏦 Bank' : '⚡ Lite'})</span></p>
                            <p class="text-[10px] text-slate-400 font-medium">${item.category}</p>
                        </div>
                    </div>
                    <p class="text-xs font-black ${isExp ? 'text-rose-400' : 'text-emerald-400'}">${isExp ? '-' : '+'}₹${Number(item.amount).toFixed(2)}</p>
                `;
                container.appendChild(el);

                if (isExp && totals[item.category] !== undefined) {
                    totals[item.category] += Number(item.amount);
                    totalExpense += Number(item.amount);
                }
            });

            runAIEngine(totals, totalExpense);
            localStorage.setItem('fintrack_auto_ai_core', JSON.stringify(state));
        }

        function openModal(mode) {
            activeMode = mode;
            document.getElementById('tx-modal').classList.remove('hidden');
            document.getElementById('modal-title').innerText = mode === 'income' ? "💰 Money In" : "💸 Expense Entry";
            document.getElementById('cat-block').style.display = mode === 'income' ? 'none' : 'block';
            document.getElementById('modal-form').reset();
        }

        function closeModal() { document.getElementById('tx-modal').classList.add('hidden'); }

        function saveEntry(e) {
            e.preventDefault();
            const amount = Number(document.getElementById('form-amount').value);
            const source = document.getElementById('form-source').value;
            const desc = document.getElementById('form-desc').value.trim() || (activeMode === 'income' ? 'Received' : 'Spent');
            const category = activeMode === 'income' ? 'Deposit' : document.getElementById('form-category').value;

            if (activeMode === 'expense') {
                if (source === 'bank' && amount > state.bank) return alert("Bank Account empty!");
                if (source === 'lite' && amount > state.lite) return alert("UPI Lite empty!");
                state[source] -= amount;
            } else {
                state[source] += amount;
            }

            state.logs.unshift({ type: activeMode, amount, source, desc, category });
            closeModal();
            renderUI();
        }

        function resetData() {
            if (confirm("Reset application engine parameters?")) {
                state = { bank: 8000, lite: 1500, logs: [] };
                renderUI();
            }
        }

        initApp();
    </script>
</body>
</html>
